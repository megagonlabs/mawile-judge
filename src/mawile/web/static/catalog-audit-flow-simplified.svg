<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 716" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Simplified sensitivity audit flow</title>
  <desc id="desc">Repeated originals establish noise and directional eligibility. Candidates are built by judge or item scope, checked by structural guards or an LLM, and judged only for accepted applications. Pairwise audits use invariants only. Reports separate stability, degradation detection, and correctness.</desc>
  <defs>
    <style>
      .h1 { font-size: 46px; font-weight: 800; fill: #10233f; }
      .eyebrow { font-size: 13px; font-weight: 800; fill: #68778a; letter-spacing: .08em; }
      .section { font-size: 24px; font-weight: 800; fill: #10233f; }
      .card-title { font-size: 18px; font-weight: 800; fill: #10233f; }
      .lane-title { font-size: 18px; font-weight: 800; fill: #10233f; }
      .step-title { font-size: 17px; font-weight: 800; fill: #10233f; }
      .body { font-size: 14.5px; fill: #31445a; }
      .small { font-size: 13.5px; fill: #526478; }
      .tiny { font-size: 12px; font-weight: 800; fill: #68778a; letter-spacing: .06em; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #405064; }
      .badge { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .chip { font-size: 12px; font-weight: 800; fill: #405064; }
      .chip-white { font-size: 12px; font-weight: 800; fill: #ffffff; }
      .green-text { fill: #187246; }
      .orange-text { fill: #9a531f; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8493a5"/>
    </marker>
    <marker id="arrowsm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#10233f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="716" fill="#f7f8fa"/>

  <text x="74" y="76" class="eyebrow">MAWILE</text>
  <text x="74" y="126" class="h1">How the audit tests a judge</text>

  <g stroke="#8493a5" stroke-width="3" marker-end="url(#arrow)" fill="none">
    <line x1="378" y1="414" x2="424" y2="414"/>
    <line x1="1178" y1="414" x2="1226" y2="414"/>
  </g>

  <!-- LEFT: inputs -->
  <rect x="72" y="214" width="300" height="420" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="98" y="253" class="eyebrow">INPUTS</text>
  <text x="98" y="289" class="section">Audit materials</text>

  <rect x="98" y="320" width="244" height="118" rx="9" fill="#ffffff" stroke="#91a1b5" stroke-width="1.6"/>
  <path d="M106 320 H334 Q342 320 342 328 V356 H98 V328 Q98 320 106 320 Z" fill="#eceef2"/>
  <text x="118" y="345" class="card-title">Judge definition</text>
  <text x="118" y="382" class="body">Prompt, rubric, model,</text>
  <text x="118" y="404" class="body">schema, and threshold</text>
  <rect x="118" y="417" width="54" height="14" rx="7" fill="#dfe7ef"/>
  <rect x="182" y="417" width="72" height="14" rx="7" fill="#dfe7ef"/>
  <rect x="264" y="417" width="46" height="14" rx="7" fill="#dfe7ef"/>

  <rect x="98" y="462" width="244" height="126" rx="9" fill="#ffffff" stroke="#91a1b5" stroke-width="1.6"/>
  <path d="M106 462 H334 Q342 462 342 470 V498 H98 V470 Q98 462 106 462 Z" fill="#eceef2"/>
  <text x="118" y="487" class="card-title">Cases to audit</text>
  <text x="118" y="524" class="body">Complete input, output,</text>
  <text x="118" y="546" class="body">and optional gold label</text>
  <g transform="translate(118 560)">
    <rect x="0" y="0" width="48" height="18" rx="9" fill="#10233f"/>
    <text x="24" y="13" text-anchor="middle" class="chip-white">input</text>
    <rect x="58" y="0" width="56" height="18" rx="9" fill="#dfe7ef"/>
    <text x="86" y="13" text-anchor="middle" class="chip">output</text>
    <rect x="124" y="0" width="46" height="18" rx="9" fill="#dfe7ef"/>
    <text x="147" y="13" text-anchor="middle" class="chip">label</text>
  </g>

  <text x="98" y="616" class="small">The graded system is not rerun.</text>

  <!-- CENTER: engine -->
  <rect x="430" y="190" width="742" height="492" rx="14" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="462" y="228" class="eyebrow">AUDIT ENGINE</text>
  <text x="462" y="263" class="section">Create variants, then re-judge</text>

  <rect x="462" y="304" width="328" height="108" rx="10" fill="#f6fbf8" stroke="#249056" stroke-width="1.6"/>
  <text x="486" y="335" class="lane-title green-text">Meaning-preserving lane</text>
  <text x="486" y="358" class="small">Expected result: same verdict</text>
  <g transform="translate(486 376)">
    <rect x="0" y="0" width="78" height="24" rx="12" fill="#249056"/>
    <text x="39" y="16" text-anchor="middle" class="chip-white">paraphrase</text>
    <rect x="88" y="0" width="76" height="24" rx="12" fill="#cce9d8"/>
    <text x="126" y="16" text-anchor="middle" class="chip">swap</text>
    <rect x="174" y="0" width="72" height="24" rx="12" fill="#cce9d8"/>
    <text x="210" y="16" text-anchor="middle" class="chip">rename</text>
  </g>

  <rect x="822" y="304" width="328" height="108" rx="10" fill="#fff8f2" stroke="#b86b2b" stroke-width="1.6"/>
  <text x="846" y="335" class="lane-title orange-text">Quality-degrading lane</text>
  <text x="846" y="358" class="small">Pointwise only: worse verdict</text>
  <g transform="translate(846 376)">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="#b86b2b"/>
    <text x="43" y="16" text-anchor="middle" class="chip-white">bad output</text>
    <rect x="96" y="0" width="88" height="24" rx="12" fill="#f0d8c4"/>
    <text x="140" y="16" text-anchor="middle" class="chip">missing step</text>
    <rect x="194" y="0" width="80" height="24" rx="12" fill="#f0d8c4"/>
    <text x="234" y="16" text-anchor="middle" class="chip">refusal</text>
  </g>

  <rect x="462" y="432" width="688" height="42" rx="10" fill="#f7fafc" stroke="#d1dbe7" stroke-width="1.4"/>
  <text x="484" y="458" class="body"><tspan style="font-weight:800;fill:#405064">Repeat originals:</tspan> noise and directional eligibility.</text>
  <g transform="translate(1068 444)">
    <circle cx="0" cy="9" r="6" fill="#10233f"/>
    <circle cx="22" cy="9" r="6" fill="#9aa8ba"/>
    <circle cx="44" cy="9" r="6" fill="#9aa8ba"/>
  </g>

  <rect x="462" y="500" width="688" height="134" rx="13" fill="#eef3f8" stroke="#cdd8e4" stroke-width="1.5"/>
  <text x="482" y="524" class="tiny">BUILD BY SCOPE; JUDGE ACCEPTED APPLICATIONS</text>

  <g transform="translate(484 544)">
    <rect x="0" y="0" width="188" height="70" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="15" fill="#10233f"/>
    <text x="26" y="33" text-anchor="middle" class="badge">1</text>
    <text x="52" y="27" class="step-title">Generate</text>
    <text x="52" y="49" class="small">judge/item edits</text>
  </g>

  <g transform="translate(720 544)">
    <rect x="0" y="0" width="188" height="70" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="15" fill="#10233f"/>
    <text x="26" y="33" text-anchor="middle" class="badge">2</text>
    <text x="52" y="27" class="step-title">Validate</text>
    <text x="52" y="49" class="small">guard or LLM check</text>
  </g>

  <g transform="translate(956 544)">
    <rect x="0" y="0" width="172" height="70" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="15" fill="#10233f"/>
    <text x="26" y="33" text-anchor="middle" class="badge">3</text>
    <text x="52" y="27" class="step-title">Judge x N</text>
    <text x="52" y="49" class="small">measure verdicts</text>
  </g>

  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowsm)" fill="none">
    <line x1="674" y1="579" x2="714" y2="579"/>
    <line x1="910" y1="579" x2="950" y2="579"/>
  </g>

  <!-- RIGHT: report answers -->
  <text x="462" y="660" class="small">Pairwise: invariants only, including candidate-position swaps.</text>

  <rect x="1230" y="214" width="320" height="420" rx="12" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1256" y="253" class="eyebrow">REPORT</text>
  <text x="1256" y="289" class="section">Evidence produced</text>

  <rect x="1256" y="320" width="268" height="88" rx="9" fill="#ffffff" stroke="#249056" stroke-width="1.5"/>
  <text x="1276" y="350" class="card-title green-text">Robustness</text>
  <text x="1276" y="374" class="body">Do harmless edits flip</text>
  <text x="1276" y="394" class="body">the judge?</text>

  <rect x="1256" y="426" width="268" height="88" rx="9" fill="#ffffff" stroke="#b86b2b" stroke-width="1.5"/>
  <text x="1276" y="456" class="card-title orange-text">Sensitivity</text>
  <text x="1276" y="480" class="body">Does the judge penalize</text>
  <text x="1276" y="500" class="body">real degradation?</text>

  <rect x="1256" y="532" width="268" height="88" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="1276" y="562" class="card-title">Correctness</text>
  <text x="1276" y="586" class="body">Do verdicts match trusted</text>
  <text x="1276" y="606" class="body">labels when available?</text>
</svg>
