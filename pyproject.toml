[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mawile"
version = "0.1.0"
description = "Multi-Axis Workbench for Inspecting LLM Evaluators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.0",
  "PyYAML>=6.0.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "tqdm>=4.66.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9"
]


[project.scripts]
mawile = "mawile.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mawile"]


